services:
  frontend:
    build:
      context: ../SimpleLMS/frontend
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - simplelms
    networks:
      - diploma-net

  simplelms:
    build:
      context: ../SimpleLMS
    container_name: simplelms
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DOCKER_NAME: postgres
    networks:
      - diploma-net

  attendance-analyser:
    build:
      context: .
    container_name: attendance-analyser
    ports:
      - "8081:8081"
    environment:
      POSTGRES_DOCKER_NAME: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LMS_BASE_URL: http://simplelms:8080
    depends_on:
      - simplelms
    networks:
      - diploma-net

networks:
  diploma-net:
    name: diploma-net
    external: true
